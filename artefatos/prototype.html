<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Tendências</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0F1729;
  --panel:#16213A;
  --panel-alt:#1C2A47;
  --border:rgba(255,255,255,0.08);
  --text:#E4E8F0;
  --text-dim:#8B96AE;
  --amber:#E8A23D;
  --amber-dim:rgba(232,162,61,0.35);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---- Header ---- */
header{
  display:flex;align-items:center;gap:14px;
  padding:18px 22px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel),var(--bg));
}
.radar-sweep{
  width:38px;height:38px;border-radius:50%;position:relative;flex-shrink:0;
  border:1px solid rgba(255,255,255,0.15);
  background:radial-gradient(circle,rgba(94,200,216,0.15) 0%,transparent 70%);
  overflow:hidden;
}
.radar-sweep::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(94,200,216,0.75),transparent 26%);
  animation:sweep 4s linear infinite;
}
@keyframes sweep{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.radar-sweep::before{animation:none;}}
.header-titles h1{
  font-family:var(--font-display);font-size:19px;font-weight:700;margin:0;letter-spacing:0.2px;
}
.header-titles p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}

/* ---- Layout ---- */
.layout{
  flex:1;display:grid;grid-template-columns:270px 1fr 300px;gap:1px;background:var(--border);
  min-height:0;
}
.panel{background:var(--bg);padding:16px;overflow-y:auto;}
.panel h2{
  font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-dim);margin:0 0 12px;
}

/* ---- Topics sidebar ---- */
.topic-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel-alt);border:1px solid var(--border);border-radius:20px;
  padding:5px 6px 5px 12px;margin:0 6px 8px 0;font-size:13px;
}
.topic-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.topic-chip button{
  background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;
  width:20px;height:20px;border-radius:50%;line-height:1;
}
.topic-chip button:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.topic-count{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin:2px 0 14px;}
.add-topic{display:flex;gap:6px;margin-bottom:20px;}
.add-topic input{
  flex:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:8px 10px;font-size:13px;font-family:var(--font-body);
}
.add-topic input:focus{outline:none;border-color:rgba(94,200,216,0.5);}
.add-topic button{
  background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;
}
.add-topic button:hover{border-color:rgba(255,255,255,0.25);}

.btn-scan{
  width:100%;background:var(--amber);color:#1A1206;border:none;border-radius:8px;
  padding:11px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:var(--font-body);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-scan:hover:not(:disabled){filter:brightness(1.08);}
.btn-scan:disabled{opacity:0.6;cursor:default;}
.spinner{
  width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,0,0,0.25);
  border-top-color:#1A1206;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.status-line{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:10px;text-align:center;}
.error-banner{
  margin-top:10px;background:rgba(232,111,95,0.12);border:1px solid rgba(232,111,95,0.4);
  color:#F0A79B;padding:8px 10px;border-radius:8px;font-size:12px;
}

.legend{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ---- Graph area ---- */
.graph-wrap{position:relative;background:
  radial-gradient(circle at 50% 50%, rgba(94,200,216,0.04), transparent 60%),
  var(--bg);
}
#graph{width:100%;height:100%;min-height:420px;}
.empty-state{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px;color:var(--text-dim);font-size:13.5px;line-height:1.6;
}
.empty-state span{font-family:var(--font-mono);}

.detail-panel{
  position:absolute;right:16px;bottom:16px;width:min(320px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px;box-shadow:0 12px 30px rgba(0,0,0,0.4);
  transform:translateY(12px);opacity:0;pointer-events:none;transition:all 0.18s ease;
}
.detail-panel.open{transform:translateY(0);opacity:1;pointer-events:auto;}
.detail-panel h3{font-family:var(--font-display);font-size:15px;margin:6px 0 8px;}
.detail-panel p{font-size:13px;line-height:1.55;color:var(--text-dim);margin:0 0 12px;}
.detail-type{
  display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;
  text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--panel-alt);color:var(--text-dim);
}
.detail-tendencia{color:#8FBF8F;}
.detail-gap{color:#E8735F;}
.detail-oportunidade{color:var(--amber);}
.detail-source{font-size:12px;color:var(--text-dim);margin-top:-6px;}
.btn-save{
  background:var(--amber);color:#1A1206;border:none;border-radius:7px;padding:8px 14px;
  font-weight:600;font-size:12.5px;cursor:pointer;margin-right:8px;
}
.btn-save:disabled{opacity:0.5;cursor:default;}
.btn-close,.btn-link{
  background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:7px;
  padding:8px 12px;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block;
}
.btn-link{color:#5EC8D8;border-color:rgba(94,200,216,0.3);}

/* ---- Ideas sidebar ---- */
.idea-card{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:10px;position:relative;
}
.idea-card .detail-type{margin-bottom:6px;}
.idea-card h4{font-family:var(--font-display);font-size:13.5px;margin:0 0 6px;padding-right:20px;}
.idea-card p{font-size:12px;color:var(--text-dim);line-height:1.5;margin:0 0 8px;}
.idea-card time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
.idea-remove{
  position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-dim);
  cursor:pointer;font-size:14px;width:20px;height:20px;border-radius:50%;
}
.idea-remove:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.empty-ideas{color:var(--text-dim);font-size:12.5px;line-height:1.6;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
  transition:all 0.2s ease;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- Graph node/link styles ---- */
.node{cursor:pointer;}
.node text{font-family:var(--font-mono);pointer-events:none;user-select:none;}
.pulse-ring{animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.5;r:19;}50%{opacity:0.15;r:24;}}
@media (prefers-reduced-motion:reduce){.pulse-ring{animation:none;}}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:auto 420px auto;}
  .panel{max-height:260px;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="radar-sweep"></div>
    <div class="header-titles">
      <h1>Radar de Tendências</h1>
      <p id="status-line">carregando…</p>
    </div>
  </header>

  <div class="layout">
    <div class="panel" id="panel-topics">
      <h2>Temas monitorados</h2>
      <div id="topics-list"></div>
      <div class="topic-count" id="topic-count"></div>
      <div class="add-topic">
        <input id="topic-input" type="text" placeholder="Adicionar tema…" maxlength="40">
        <button id="add-topic-btn">+</button>
      </div>
      <button class="btn-scan" id="scan-btn">Atualizar notícias</button>
      <div class="error-banner" id="error-banner" style="display:none;"></div>

      <div class="legend" id="legend"></div>
    </div>

    <div class="panel graph-wrap" style="padding:0;">
      <div id="graph"></div>
      <div class="empty-state" id="empty-state">
        Adicione temas ao lado e clique em <span>"Atualizar notícias"</span><br>
        para o radar buscar conexões, tendências e lacunas entre eles.
      </div>
      <div class="detail-panel" id="detail-panel"></div>
    </div>

    <div class="panel" id="panel-ideas">
      <h2>Minhas ideias salvas</h2>
      <div id="ideas-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const STORAGE_KEYS = { topics:'tracked_topics', ideas:'saved_ideas', lastScan:'last_scan' };
const DEFAULT_TOPICS = ['Inteligência Artificial','Energia','Blockchain','Computação Quântica'];
const TOPIC_COLORS = ['#5EC8D8','#E8735F','#9B8FE0','#8FBF8F','#D8C15E','#E85F8C'];
const MAX_TOPICS = 5;

let state = {
  topics: [...DEFAULT_TOPICS],
  graph: { nodes: [], links: [] },
  ideas: [],
  loading: false,
  error: null,
  lastUpdated: null,
};
let simulation = null;

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function topicColor(topic){
  const idx = state.topics.indexOf(topic);
  return TOPIC_COLORS[(idx >= 0 ? idx : 0) % TOPIC_COLORS.length];
}

/* ---------------- persistence ---------------- */
async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEYS.topics);
    if(r && r.value){ const t = JSON.parse(r.value); if(Array.isArray(t) && t.length) state.topics = t; }
  }catch(e){}
  try{
    const r = await window.storage.get(STORAGE_KEYS.ideas);
    if(r && r.value){ const i = JSON.parse(r.value); if(Array.isArray(i)) state.ideas = i; }
  }catch(e){}
  try{
    const r = await window.storage.get(STORAGE_KEYS.lastScan);
    if(r && r.value){
      const ls = JSON.parse(r.value);
      if(ls && ls.graph){ state.graph = ls.graph; state.lastUpdated = ls.lastUpdated; }
    }
  }catch(e){}
}
async function persistTopics(){
  try{ await window.storage.set(STORAGE_KEYS.topics, JSON.stringify(state.topics), false); }catch(e){ console.error(e); }
}
async function persistIdeas(){
  try{ await window.storage.set(STORAGE_KEYS.ideas, JSON.stringify(state.ideas), false); }catch(e){ console.error(e); }
}
async function persistLastScan(){
  try{
    await window.storage.set(STORAGE_KEYS.lastScan, JSON.stringify({graph:state.graph, lastUpdated:state.lastUpdated}), false);
  }catch(e){ console.error(e); }
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function flashMessage(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2400);
}

/* ---------------- topics UI ---------------- */
function renderTopics(){
  const list = document.getElementById('topics-list');
  list.innerHTML = '';
  state.topics.forEach(t=>{
    const chip = document.createElement('span');
    chip.className = 'topic-chip';
    chip.innerHTML = `<span class="dot" style="background:${topicColor(t)}"></span>${escapeHtml(t)}`;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.title = 'Remover tema';
    btn.onclick = ()=> removeTopic(t);
    chip.appendChild(btn);
    list.appendChild(chip);
  });
  document.getElementById('topic-count').textContent = `${state.topics.length}/${MAX_TOPICS} temas · até ${MAX_TOPICS} por vez, para manter a análise focada`;
  document.getElementById('add-topic-btn').disabled = state.topics.length >= MAX_TOPICS;

  const legend = document.getElementById('legend');
  legend.innerHTML = '<h2 style="margin-bottom:8px;">Legenda</h2>';
  state.topics.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'legend-item';
    row.innerHTML = `<span class="legend-dot" style="background:${topicColor(t)}"></span>${escapeHtml(t)}`;
    legend.appendChild(row);
  });
  const insightRow = document.createElement('div');
  insightRow.className = 'legend-item';
  insightRow.innerHTML = `<span class="legend-dot" style="background:var(--amber)"></span>Tendência / gap / oportunidade`;
  legend.appendChild(insightRow);
}

function addTopic(name){
  name = name.trim();
  if(!name) return;
  if(state.topics.some(t=> t.toLowerCase() === name.toLowerCase())) return;
  if(state.topics.length >= MAX_TOPICS){ flashMessage(`Máximo de ${MAX_TOPICS} temas por vez.`); return; }
  state.topics.push(name);
  persistTopics();
  renderTopics();
}
function removeTopic(name){
  state.topics = state.topics.filter(t=> t !== name);
  persistTopics();
  renderTopics();
}

/* ---------------- ideas UI ---------------- */
function renderIdeas(){
  const list = document.getElementById('ideas-list');
  if(!state.ideas.length){
    list.innerHTML = `<div class="empty-ideas">Nenhuma ideia salva ainda. Quando o radar sinalizar uma tendência, gap ou oportunidade, clique no nó âmbar e salve aqui.</div>`;
    return;
  }
  list.innerHTML = '';
  state.ideas.forEach(idea=>{
    const card = document.createElement('div');
    card.className = 'idea-card';
    const dateStr = idea.savedAt ? new Date(idea.savedAt).toLocaleDateString('pt-BR', {day:'2-digit',month:'short'}) : '';
    card.innerHTML = `
      <span class="detail-type detail-${idea.type||'oportunidade'}">${labelForType(idea.type)}</span>
      <button class="idea-remove" title="Remover">×</button>
      <h4>${escapeHtml(idea.title)}</h4>
      <p>${escapeHtml(idea.description)}</p>
      <time>salvo em ${dateStr}</time>
    `;
    card.querySelector('.idea-remove').onclick = ()=> removeIdea(idea.id);
    list.appendChild(card);
  });
}
function labelForType(t){
  return t === 'tendencia' ? 'Tendência' : t === 'gap' ? 'Gap de mercado' : 'Oportunidade';
}
async function saveIdea(node){
  if(state.ideas.some(i=> i.id === node.id)){ flashMessage('Essa ideia já está salva.'); return; }
  state.ideas.unshift({
    id: node.id, type: node.insightType, title: node.title,
    description: node.description, savedAt: new Date().toISOString()
  });
  await persistIdeas();
  renderIdeas();
  flashMessage('Ideia salva ✓');
  document.getElementById('detail-panel').classList.remove('open');
}
async function removeIdea(id){
  state.ideas = state.ideas.filter(i=> i.id !== id);
  await persistIdeas();
  renderIdeas();
}

/* ---------------- detail panel ---------------- */
function showDetail(d){
  const panel = document.getElementById('detail-panel');
  if(d.type === 'insight'){
    const already = state.ideas.some(i=> i.id === d.id);
    panel.innerHTML = `
      <span class="detail-type detail-${d.insightType}">${labelForType(d.insightType)}</span>
      <h3>${escapeHtml(d.title)}</h3>
      <p>${escapeHtml(d.description)}</p>
      <button class="btn-save" id="save-btn" ${already?'disabled':''}>${already?'Já salva':'Salvar ideia'}</button>
      <button class="btn-close" id="close-btn">Fechar</button>
    `;
    if(!already) panel.querySelector('#save-btn').onclick = ()=> saveIdea(d);
  } else {
    panel.innerHTML = `
      <span class="detail-type" style="color:${d.color}">${escapeHtml(d.topic)}</span>
      <h3>${escapeHtml(d.title)}</h3>
      <p>${escapeHtml(d.summary)}</p>
      ${d.source ? `<p class="detail-source">Fonte: ${escapeHtml(d.source)}</p>` : ''}
      <div style="margin-top:10px;">
        ${d.url ? `<a class="btn-link" href="${d.url}" target="_blank" rel="noopener">Ver notícia ↗</a>` : ''}
        <button class="btn-close" id="close-btn" style="margin-left:8px;">Fechar</button>
      </div>
    `;
  }
  panel.querySelector('#close-btn').onclick = ()=> panel.classList.remove('open');
  panel.classList.add('open');
}

/* ---------------- graph rendering ---------------- */
function drag(sim){
  function started(event,d){ if(!event.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; }
  function dragged(event,d){ d.fx=event.x; d.fy=event.y; }
  function ended(event,d){ if(!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }
  return d3.drag().on('start',started).on('drag',dragged).on('end',ended);
}

function renderGraph(){
  const container = document.getElementById('graph');
  const empty = document.getElementById('empty-state');
  container.innerHTML = '';
  if(simulation){ simulation.stop(); simulation = null; }

  if(!state.graph.nodes.length){
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  const width = container.clientWidth || 600;
  const height = container.clientHeight || 420;
  const svg = d3.select(container).append('svg').attr('width', width).attr('height', height);

  const rings = svg.append('g').attr('transform', `translate(${width/2},${height/2})`);
  [1,2,3].forEach(i=>{
    rings.append('circle').attr('r', i*Math.min(width,height)/7)
      .attr('fill','none').attr('stroke','rgba(255,255,255,0.05)');
  });

  const nodes = state.graph.nodes.map(d=> ({...d}));
  const links = state.graph.links.map(d=> ({...d}));

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(90).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-230))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide().radius(d=> d.r + 20));

  const linkSel = svg.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d=> d.kind === 'insight' ? 'rgba(232,162,61,0.55)' : 'rgba(255,255,255,0.15)')
    .attr('stroke-width', d=> d.kind === 'insight' ? 2 : 1)
    .attr('stroke-dasharray', d=> d.kind === 'insight' ? '4,3' : null);

  const nodeSel = svg.append('g').selectAll('g').data(nodes).join('g')
    .attr('class', d=> 'node node-'+d.type)
    .call(drag(simulation))
    .on('click', (event,d)=> showDetail(d));

  nodeSel.filter(d=> d.type==='insight').append('circle')
    .attr('class','pulse-ring').attr('r', d=>d.r+5)
    .attr('fill','none').attr('stroke','rgba(232,162,61,0.4)').attr('stroke-width',1);

  nodeSel.append('circle')
    .attr('r', d=>d.r)
    .attr('fill', d=>d.color)
    .attr('fill-opacity', d=> d.type==='insight' ? 0.95 : 0.8)
    .attr('stroke', d=> d.type==='insight' ? 'var(--amber)' : 'rgba(255,255,255,0.35)')
    .attr('stroke-width', d=> d.type==='insight' ? 2 : 1);

  nodeSel.append('text')
    .text(d=> d.title.length > 24 ? d.title.slice(0,22)+'…' : d.title)
    .attr('x', d=> d.r+6).attr('y', 4)
    .attr('font-size', 10.5).attr('fill', 'var(--text-dim)');

  simulation.on('tick', ()=>{
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeSel.attr('transform', d=>`translate(${d.x},${d.y})`);
  });
}

/* ---------------- graph building from API result ---------------- */
function buildGraph(parsed){
  const items = Array.isArray(parsed.items) ? parsed.items : [];
  const insights = Array.isArray(parsed.insights) ? parsed.insights : [];

  const nodes = [];
  items.forEach(it=>{
    nodes.push({
      id: it.id, type:'news', topic: it.topic, title: it.title || '(sem título)',
      summary: it.summary || '', source: it.source || '', url: it.url || '',
      entities: Array.isArray(it.entities) ? it.entities : [],
      color: topicColor(it.topic), r: 9
    });
  });
  insights.forEach(ins=>{
    nodes.push({
      id: ins.id, type:'insight', insightType: ['tendencia','gap','oportunidade'].includes(ins.type) ? ins.type : 'oportunidade',
      title: ins.title || '(sem título)', description: ins.description || '',
      related: Array.isArray(ins.related_items) ? ins.related_items : [],
      color: '#E8A23D', r: 14
    });
  });

  const links = [];
  for(let i=0;i<items.length;i++){
    for(let j=i+1;j<items.length;j++){
      const a = (items[i].entities||[]).map(e=>String(e).toLowerCase());
      const b = (items[j].entities||[]).map(e=>String(e).toLowerCase());
      if(a.some(e=> b.includes(e))){
        links.push({source: items[i].id, target: items[j].id, kind:'entity'});
      }
    }
  }
  insights.forEach(ins=>{
    (ins.related_items||[]).forEach(rid=>{
      if(items.find(it=> it.id === rid)){
        links.push({source: ins.id, target: rid, kind:'insight'});
      }
    });
  });

  state.graph = { nodes, links };
}

/* ---------------- scanning via Claude API ---------------- */
const SYSTEM_PROMPT = `Você é um motor de pesquisa e análise de notícias de tecnologia e negócios.
Use a ferramenta de busca web para encontrar notícias recentes (últimos 30 dias) sobre os temas fornecidos.
Depois de pesquisar, responda APENAS com um objeto JSON válido, sem markdown, sem texto antes ou depois, neste formato exato:
{"items":[{"id":"n1","topic":"<um dos temas exatamente como fornecido>","title":"<título curto>","summary":"<resumo em 1 frase, até 20 palavras, em português>","source":"<nome da fonte>","url":"<url da notícia>","entities":["<até 3 palavras-chave curtas>"]}],"insights":[{"id":"i1","type":"tendencia|gap|oportunidade","title":"<título curto e direto>","description":"<explicação em até 25 palavras, em português, do porquê isso é relevante, cruzando informação entre temas quando possível>","related_items":["n1","n2"]}]}
Regras: no máximo 2 items por tema, no máximo 8 items no total, no máximo 3 insights no total.
Priorize insights que conectam mais de um tema entre si (interseções entre setores).
Seja extremamente conciso. Nunca invente notícias — baseie-se apenas no que encontrar na busca.
Se não encontrar nada relevante para um tema, pule esse tema.`;

async function scanNews(){
  if(state.loading) return;
  state.loading = true;
  state.error = null;
  updateStatus();

  const topicsToScan = state.topics.slice(0, MAX_TOPICS);
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: SYSTEM_PROMPT,
        messages:[{ role:'user', content:`Temas para monitorar agora: ${topicsToScan.join(', ')}. Pesquise notícias recentes sobre cada um e identifique conexões, tendências emergentes ou lacunas de mercado entre eles.` }],
        tools:[{ type:'web_search_20250305', name:'web_search' }]
      })
    });
    const data = await res.json();
    if(!res.ok){
      throw new Error((data && data.error && data.error.message) || 'Erro na chamada da API');
    }
    const textBlocks = (data.content || []).filter(b=> b.type === 'text').map(b=> b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    buildGraph(parsed);
    state.lastUpdated = new Date().toISOString();
    await persistLastScan();
  }catch(err){
    console.error(err);
    state.error = 'Não consegui buscar ou interpretar as notícias agora. Tente novamente em instantes.';
  }
  state.loading = false;
  renderGraph();
  updateStatus();
}

/* ---------------- status / header ---------------- */
function updateStatus(){
  const btn = document.getElementById('scan-btn');
  const line = document.getElementById('status-line');
  const banner = document.getElementById('error-banner');

  btn.disabled = state.loading;
  btn.innerHTML = state.loading ? `<span class="spinner"></span> Buscando…` : 'Atualizar notícias';

  if(state.error){
    banner.style.display = 'block';
    banner.textContent = state.error;
  } else {
    banner.style.display = 'none';
  }

  if(state.loading){
    line.textContent = 'buscando e analisando notícias…';
  } else if(state.lastUpdated){
    const d = new Date(state.lastUpdated);
    line.textContent = `última atualização: ${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  } else {
    line.textContent = 'nenhuma varredura ainda';
  }
}

/* ---------------- init ---------------- */
async function init(){
  await loadState();
  renderTopics();
  renderIdeas();
  renderGraph();
  updateStatus();

  document.getElementById('scan-btn').onclick = scanNews;
  document.getElementById('add-topic-btn').onclick = ()=>{
    const input = document.getElementById('topic-input');
    addTopic(input.value);
    input.value = '';
  };
  document.getElementById('topic-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      addTopic(e.target.value);
      e.target.value = '';
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{ if(state.graph.nodes.length) renderGraph(); }, 250);
  });
}
init();
</script>
